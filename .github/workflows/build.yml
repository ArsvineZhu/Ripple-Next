name: Ripple Next CI and Release
on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c
        with:
          install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          EXPECTED_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected_tag="v$(node -p 'require("./package.json").version')"
          if [ "$EXPECTED_RELEASE_TAG" != "$expected_tag" ]; then
            echo "Tag $EXPECTED_RELEASE_TAG does not match package version $expected_tag" >&2
            exit 1
          fi
      - run: pnpm check
      - run: pnpm test
  build:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS-x64, os: macos-latest, arch: x64 }
          - { name: macOS-arm64, os: macos-latest, arch: arm64 }
          - { name: Windows, os: windows-latest, arch: x64 }
          - { name: Linux, os: ubuntu-latest, arch: x64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c
        with:
          install: false
          cache: true
      - name: Linux installer prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot dpkg
      - name: WiX prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y
          "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: pnpm install --frozen-lockfile
      - run: pnpm run make --arch=${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: RippleNext-${{ matrix.name }}
          path: |
            out/make/**/*.dmg
            out/make/**/*.msi
            out/make/**/*.deb
            out/make/**/*.rpm
            out/make/**/*.zip
          if-no-files-found: error
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: RippleNext-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mapfile -d '' release_files < <(find release-assets -type f -print0 | sort -z)
          if [ "${#release_files[@]}" -ne 9 ]; then
            echo "Expected nine release packages; found ${#release_files[@]}" >&2
            exit 1
          fi

          release_notes_file="${RUNNER_TEMP}/release-notes.md"
          node scripts/release-notes.mjs "$RELEASE_TAG" > "$release_notes_file"
          release_notes_args=(--notes-file "$release_notes_file")
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = false ]; then
              echo "Release $RELEASE_TAG already exists; keeping its original artifacts"
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag --draft \
              --title "Ripple Next $RELEASE_TAG" \
              "${release_notes_args[@]}"
          fi
          gh release upload "$RELEASE_TAG" "${release_files[@]}" --clobber
          gh release edit "$RELEASE_TAG" --notes-file "$release_notes_file" --draft=false --prerelease=false --latest
